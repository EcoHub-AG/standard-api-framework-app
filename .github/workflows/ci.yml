name: CI

# Sanity-checks every push/PR: frontend type-checks and builds, and the
# Rust side compiles cleanly on both target platforms (macOS + Windows —
# this app doesn't ship a Linux build). Runs fast, no signing/release
# secrets involved. See release.yml for the actual signed-build pipeline.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  rust-check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (populates dist/ for build.rs)
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
