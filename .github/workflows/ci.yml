name: CI

# Sanity-checks every push/PR: frontend type-checks and builds, and the
# Rust side compiles cleanly on both target platforms (macOS + Windows —
# this app doesn't ship a Linux build). Runs fast, no signing/release
# secrets involved. See release.yml for the actual signed-build pipeline.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  rust-check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (populates dist/ for build.rs)
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        # librdkafka 2.3.0's vendored CMakeLists.txt declares
        # cmake_minimum_required(VERSION 3.2), which CMake >= 4.0 (on the
        # GitHub-hosted runners) refuses to configure since it dropped
        # support for policies below 3.5. This tells CMake to treat it as
        # 3.5 instead of failing outright.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo check --all-targets
